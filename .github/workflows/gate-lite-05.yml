name: Gate-lite 0.5 candidate

on:
  pull_request:
    paths:
      - "gate-lite/**"
      - ".github/workflows/gate-lite-05.yml"
  push:
    branches:
      - codex/gate-lite-05-profile

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./gate-lite
          python -c 'import continuity_receipt; assert continuity_receipt.__version__ == "0.5.0"'

      - name: Run gate-lite unit and protocol tests
        working-directory: gate-lite
        run: python -m unittest discover -s tests -v
